<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <!-- figma:head-end -->
    <style>
      .page-switcher {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 9999;
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: rgb(255 255 255 / 92%);
        box-shadow: 0 8px 24px rgb(0 0 0 / 16%);
        font-family: Arial, sans-serif;
        font-size: 12px;
        backdrop-filter: blur(8px);
      }

      .page-switcher a {
        padding: 8px 14px;
        border-radius: 999px;
        color: #393939;
        font-weight: 600;
        text-decoration: none;
      }

      .page-switcher a[aria-current='page'] {
        color: white;
        background: #f70080;
      }
    </style>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
    <nav class="page-switcher" aria-label="Page switcher">
      <a href="./" aria-current="page">Home</a>
      <a href="./services.html">Services</a>
    </nav>
  </body>
</html>
